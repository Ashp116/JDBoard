# Builds the frontend and attaches it to GitHub releases as
# jdboard-frontend.tar.gz, so scripts/install.sh works on a Jetson
# without Node. Also runs on pull requests as a type-check/build test.
name: Frontend build

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-release.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package
        run: tar -czf ../jdboard-frontend.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: jdboard-frontend
          path: jdboard-frontend.tar.gz
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ../jdboard-frontend.tar.gz --clobber
