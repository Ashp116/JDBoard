# Builds the documentation site (docs/, Docusaurus) and publishes it to
# GitHub Pages at https://ashp116.github.io/JDBoard/.
#
# - Push to main touching docs/: rebuild and publish ("main" in the version menu).
# - Version tag pushed (v1.2.0, v0.1.0beta, ...): snapshot docs/ as a version
#   named after the tag (versioned_docs/version-<tag>), commit it to main, and
#   start this workflow on main to publish it, so the tag appears in the version
#   menu. (Pages only deploys from main, and pushes made with GITHUB_TOKEN don't
#   start workflows.) Run it by hand with a tag to snapshot a tag already pushed.
# - Pull requests touching docs/: build only, as a check.
name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']          # path filters don't apply to tags
    paths: ['docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Snapshot the docs for this tag (leave empty to just republish main)'
        required: false

permissions:
  contents: read

jobs:
  snapshot:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Snapshot the docs as ${{ inputs.tag || github.ref_name }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f versions.json ] && node -e "process.exit(require('./versions.json').includes(process.env.TAG) ? 0 : 1)"; then
            echo "Docs version $TAG already exists"
          else
            npm run docusaurus -- docs:version "$TAG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json versioned_docs versioned_sidebars
            git commit -m "DOCS: Snapshot the docs for $TAG"
            # main may have moved on while this ran: rebase onto it and retry
            for attempt in 1 2 3; do
              git pull --rebase -q origin main && git push origin HEAD:main && break
              [ "$attempt" -eq 3 ] && exit 1
              sleep 5
            done
          fi
          gh workflow run docs.yml --ref main

  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.tag }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; don't cancel one that's running
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
