# Installed by scripts/install.sh as /etc/nginx/sites-available/jdboard
# @LISTEN_PORT@ and @BACKEND_PORT@ are filled in by the installer.
server {
    listen @LISTEN_PORT@ default_server;
    listen [::]:@LISTEN_PORT@ default_server;
    server_name _;

    # Everything needs the JDBoard login (change it with: sudo jdboard-passwd)
    auth_basic "JDBoard";
    auth_basic_user_file /etc/jdboard/htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Built frontend
    root /opt/jdboard/frontend;
    index index.html;

    location / {
        # Client-side routes (/models, /inference/...) all load the app
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /assets/ {
        # Vite puts a content hash in asset names
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Backend API and Socket.IO (WebSocket) - the backend handles the /api prefix
    location /api/ {
        proxy_pass http://127.0.0.1:@BACKEND_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jdboard_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The login was checked here; don't pass it on
        proxy_set_header Authorization "";

        # Model uploads (backend limit is 500 MB), streamed straight through so
        # the browser's upload progress is real
        client_max_body_size 600m;
        proxy_request_buffering off;
        # Loading a large model or a long WebSocket connection
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

map $http_upgrade $jdboard_connection_upgrade {
    default upgrade;
    ''      close;
}
