# Installed by scripts/install.sh as /etc/systemd/system/nginx.service.d/jdboard.conf
# When nginx starts (e.g. at boot), drop the JDBoard site if it was left enabled
# by a power cut and JDBoard isn't starting - JDBoard enables it when it starts.
[Service]
ExecStartPre=-/opt/jdboard/bin/jdboard-web nginx-start
