# Installed by scripts/install.sh as /etc/fail2ban/jail.d/jdboard.conf
# Block an IP for 15 minutes after 5 wrong dashboard logins within 10 minutes.
# Unban:  sudo fail2ban-client set nginx-http-auth unbanip <ip>
[nginx-http-auth]
enabled  = true
port     = @PORTS@
# nginx writes failed logins to its error log, not the journal
backend  = auto
logpath  = /var/log/nginx/error.log
maxretry = 5
findtime = 10m
bantime  = 15m
ignoreip = 127.0.0.1/8 ::1
